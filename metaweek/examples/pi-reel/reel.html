(async () => {

  const C = { ink: '#F0E6D6', dim: 'rgba(240,230,214,.55)', or: '#C9621F', or2: '#E3843D', mar: '#6E1E2B', mar2: '#92303F', blu: '#1F3656', bp: '#6F98C8', cof: '#3A2A20', bg: '#151A26' };

  }

  const pi1 = E('text', { x: 548, y: 840, 'text-anchor': 'middle', 'dominant-baseline': 'central', style: `font:italic 520px "Instrument Serif";fill:${C.ink}` }, v1); pi1.textContent = 'π';
  life.push((t) => ring1.spin(-t * 7));
  const s314 = H(`<div class="slab" style="left:84px;top:1036px;background:var(--or);color:#151A26;transform:rotate(-3deg);display:flex;align-items:center;gap:22px">
      <div class="bs" style="font-size:250px;letter-spacing:-4px">314</div>
      <div class="mono" style="font-size:34px;line-height:1.25;color:#151A26">TRILLION<br>DIGITS<br>CALCULATED</div></div>`, S1.w);
  const s15 = H(`<div class="slab" style="right:96px;top:392px;background:var(--blu);border:4px solid var(--ink);box-shadow:14px 14px 0 var(--or);display:flex;align-items:center;gap:20px">
      <div class="mono" style="font-size:30px;line-height:1.3">NASA<br>USES</div>
      <div class="bs" style="font-size:230px">15</div></div>`, S1.w);
  gsap.set(s15, { rotation: 4 }); hide(s15);

  gsap.set(words, { rotationX: 9, scale: 1.035, transformOrigin: '540px 840px' });
  cam(0, T('what') - .3, { rotationX: 26, scale: 1.1, y: -20 }, { rotationX: 4, scale: 1, y: 0 }, 'sine.inOut', .35, '540px 840px');
  tl.fromTo(s314, { scale: 1 }, { scale: 1.07, duration: .14, yoyo: true, repeat: 1, ease: 'power2.out', immediateRender: false }, wt('hook', /314/));
  sfx(0.02, 'boom', .8); sfx(wt('hook', /314/), 'impact', .7);

  tl.to(ring1.spans[0], { fill: C.or2, duration: .4 }, wt('nasa0', /fifteen/));

  for (let k = 15; k >= 0; k--) H(`<div class="abs" style="inset:0;border-radius:50%;transform:translateZ(${-1 - k * 2.6}px);background:${k === 0
      ? 'repeating-radial-gradient(circle,rgba(111,152,200,0) 0 34px,rgba(111,152,200,.28) 34px 36px),radial-gradient(circle,#4D382A 0%,#3A2A20 70%,#33251C 100%)'

  const ga = A0 + 6.14, gapLab = E('text', { x: CX + (WR + 40) * Math.cos(ga) - 6, y: CY + (WR + 40) * Math.sin(ga) - 24, 'text-anchor': 'end', style: `font:700 34px "Geist Mono";fill:${C.or2}` }, v2); gapLab.textContent = '+0.14159…';
  hide(...nums, gapLab);
  // type
  const q2 = H(`<div class="abs" style="left:0;width:1080px;top:404px;display:flex;justify-content:center;align-items:center;gap:26px">

  const anyc = H(`<div class="slab mono" style="left:50%;top:430px;background:var(--ink);color:#151A26;box-shadow:10px 10px 0 var(--or);font-size:34px;transform:translateX(-50%)">TAKE ANY CIRCLE</div>`, S2.w);

  tl.to([row6, brk, brkL, jpl, lbl6], { autoAlpha: 0, duration: .3 }, zA);
  pop(inch, wt('inch', /half/) + .1, { scale: 1.6, rotation: -12 }); sfx(wt('inch', /half/) + .15, 'impact', .9);
  const pa = -Math.PI / 2 - .5, pb = -Math.PI / 2 - .12;
  life.push((t) => {
    const k = clamp(0, 1, (t - t6) / (zA - t6)), a = pa + (pb - pa) * k;
    probe.setAttribute('transform', `translate(${GX + (GR + 10) * Math.cos(a)} ${GY + (GR + 10) * Math.sin(a)}) rotate(${(a + Math.PI / 2) * 180 / Math.PI})`);
  });

  /* ======================= S7 UNIVERSE — 37 decimals around the visible universe, to one atom */
  const S7 = scene(); cut(T('uni') - .25, S6, S7);
  const UX = 540, UY = 900, UR = 330;
  const v7 = E('svg', { width: 1080, height: 1920 }, S7.g);
  const stars = [];
  for (let k = 0; k < 220; k++) stars.push(E('circle', { cx: -400 + rnd() * 1880, cy: 100 + rnd() * 1700, r: .6 + rnd() * 2.2, fill: rnd() < .15 ? C.or2 : C.ink, opacity: .2 + rnd() * .6 }, v7));
  [[300, 640, 260, 'rgba(111,152,200,.10)'], [820, 1180, 300, 'rgba(146,48,63,.12)'], [640, 760, 200, 'rgba(201,98,31,.08)']].forEach(([x, y, r, c]) => E('ellipse', { cx: x, cy: y, rx: r, ry: r * .45, fill: c, transform: `rotate(-24 ${x} ${y})` }, v7));
  E('circle', { cx: UX, cy: UY, r: UR - 26, fill: 'rgba(31,54,86,.35)', stroke: C.bp, 'stroke-width': 2, 'stroke-opacity': .5 }, v7);
  const uring = E('circle', { cx: UX, cy: UY, r: UR - 26, fill: 'none', stroke: C.or2, 'stroke-width': 6, transform: `rotate(-90 ${UX} ${UY})` }, v7);
  const d37 = PI.slice(0, 39);                                                      // 3 + 37 decimals + 1 = 38 digits shown
  const ring7 = ringText(v7, UX, UY, UR, [[d37.slice(0, 2), `fill:${C.ink}`], [d37.slice(2), `fill:${C.or2}`], [' · ', `fill:${C.dim}`]], 34);
  const inner7 = ringText(v7, UX, UY, UR - 66, [['VISIBLE UNIVERSE · VISIBLE UNIVERSE · VISIBLE UNIVERSE · ', `fill:${C.bp}`]], 24);
  life.push((t) => { ring7.spin(-t * 4); inner7.spin(t * 6); stars.forEach((s, i) => { if (i % 7 === 0) s.style.opacity = Math.sin(t * 2 + i) > .5 ? .9 : .25; }); });
  const n37 = H(`<div class="abs" style="left:0;width:1080px;top:${UY - 150}px;text-align:center">
      <div class="bs" style="font-size:250px">37</div><div class="mono" style="font-size:30px;margin-top:10px;color:var(--or2)">DECIMALS</div></div>`, S7.w);
  // atom callout
  const atomP = [UX + UR * Math.cos(-.45), UY + UR * Math.sin(-.45)];
  const call = E('g', {}, E('svg', { width: 1080, height: 1920 }, S7.w));
  E('circle', { cx: atomP[0], cy: atomP[1], r: 8, fill: C.ink }, call);
  E('polyline', { points: `${atomP[0]},${atomP[1]} ${atomP[0] + 60},${atomP[1] - 120} 860,560`, fill: 'none', stroke: C.ink, 'stroke-width': 3 }, call);
  const atom = H(`<div class="slab" style="left:620px;top:396px;width:364px;background:var(--ink);color:#151A26;box-shadow:12px 12px 0 var(--or);white-space:normal">
      <svg width="120" height="120" style="position:relative;display:block" viewBox="-60 -60 120 120">
        <ellipse rx="54" ry="18" fill="none" stroke="#151A26" stroke-width="5"/><ellipse rx="54" ry="18" fill="none" stroke="#151A26" stroke-width="5" transform="rotate(60)"/>
        <ellipse rx="54" ry="18" fill="none" stroke="#151A26" stroke-width="5" transform="rotate(-60)"/><circle r="10" fill="#C9621F"/></svg>
      <div class="bs" style="font-size:84px;margin-top:10px">1 ATOM</div><div class="mono" style="font-size:24px;margin-top:8px">ACCURACY</div></div>`, S7.w);
  const msr = H(`<div class="abs mono" style="left:96px;top:404px;font-size:30px;line-height:1.5">MEASURE<br>AROUND THE<br><span style="color:var(--bp)">VISIBLE UNIVERSE</span></div>`, S7.w);
  hide(n37, call, atom, msr, ring7.g, inner7.g);
  const t7 = T('uni') - .25;
  cam(t7, wt('uni', /universe/) + .4 - t7, { scale: 2.6, rotationX: 16 }, { scale: 1, rotationX: 0 }, 'power2.inOut', .25, `${UX}px ${UY}px`);
  cam(wt('uni', /universe/) + .4, L.uni.end - wt('uni', /universe/), { scale: 1, rotationX: 0 }, { scale: 1.04, rotationX: 6 }, 'sine.inOut', .25, `${UX}px ${UY}px`);
  sfx(t7 + .1, 'swell', .7, 2.2);
  pop(n37, T('uni'), { scale: 1.5 }); sfx(T('uni') + .05, 'impact', .6);
  tl.set([ring7.g], { autoAlpha: 1 }, wt('uni', /37/));
  draw(uring, wt('uni', /37/), .9);
  tl.fromTo(ring7.spans, { fillOpacity: 0 }, { fillOpacity: 1, duration: .15, stagger: .25, immediateRender: false }, wt('uni', /decimals/));
  slide(msr, wt('uni', /measure/) - .2, -60);
  tl.to(inner7.g, { autoAlpha: 1, duration: .5 }, wt('uni', /visible/));
  tl.to(call, { autoAlpha: 1, duration: .3 }, wt('uni', /accurate/));
  pop(atom, wt('uni', /atom/) - .25, { scale: 1.5, rotation: 8 }); sfx(wt('uni', /atom/) - .2, 'pop', 1);

  /* ======================= S8 THE POINT — pure curiosity; pi never ends, we just stop counting */
  const S8 = scene(); cut(T('cur') - .25, S7, S8);
  const tick8 = [0, 1, 2, 3, 4].map((k) => H(`<div class="abs mono" style="left:0;top:${470 + k * 170}px;white-space:nowrap;font-size:${[30, 44, 30, 56, 30][k]}px;font-weight:400;letter-spacing:.3em;color:rgba(240,230,214,${[.18, .3, .14, .22, .12][k]})">${PI.slice(40 + k * 120, 40 + k * 120 + 160)}</div>`, S8.g));
  life.push((t) => tick8.forEach((e, k) => { e.style.transform = `translateX(${-((t - 40) * [140, 220, 110, 300, 90][k]) % 2400}px)`; }));
  const after = H(`<div class="abs mono" style="left:96px;top:404px;font-size:30px;color:var(--dim)">DECIMAL 38 → ∞</div>`, S8.w);
  const pure = H(`<div class="abs" style="left:96px;top:560px">
      <div class="bs" style="font-size:250px">PURE</div>
      <div class="slab bs" style="position:relative;display:inline-block;margin-top:24px;background:var(--mar);box-shadow:16px 16px 0 var(--or);font-size:190px;transform:rotate(-3deg)">CURIOSITY</div></div>`, S8.w);
  hide(after, ...pure.children);
  const t8 = T('cur') - .25;
  cam(t8, .7, { x: -240, rotationY: 24, scale: 1.05 }, { x: 0, rotationY: 0, scale: 1 }, 'power3.out', .35);
  slide(after, T('cur'), -40);
  tl.fromTo(pure.children[0], { autoAlpha: 0, y: 80 }, { autoAlpha: 1, y: 0, duration: .45, ease: 'power3.out', immediateRender: false }, wt('cur', /pure/) - .2);
  pop(pure.children[1], wt('cur', /curiosity/) - .1, { scale: 1.6, rotation: -14 }); sfx(wt('cur', /curiosity/) - .05, 'impact', .8);
  // final card
  const fin = layer(world), finw = layer(words); hide(fin, finw);
  const v8 = E('svg', { width: 1080, height: 1920 }, fin);
  E('circle', { cx: 540, cy: 820, r: 300, fill: 'rgba(31,54,86,.4)', stroke: C.bp, 'stroke-width': 2, 'stroke-opacity': .4 }, v8);
  const ring8 = ringText(v8, 540, 820, 330, [['PI NEVER ENDS', `fill:${C.ink}`], [' ● ', `fill:${C.or2}`], ['WE JUST STOP COUNTING', `fill:${C.ink}`], [' ● ', `fill:${C.or2}`]], 40);
  const pi8 = E('text', { x: 548, y: 820, 'text-anchor': 'middle', 'dominant-baseline': 'central', style: `font:italic 470px "Instrument Serif";fill:${C.or2}` }, v8); pi8.textContent = 'π';
  life.push((t) => ring8.spin(-t * 10));
  const last = H(`<div class="abs" style="left:96px;top:1190px;width:888px;height:110px;display:flex;align-items:center;gap:0">
      <div class="bs" id="lastd" style="font-size:96px;white-space:nowrap;overflow:hidden;width:690px"></div>
      <div class="bs" style="font-size:66px;background:var(--mar);box-shadow:10px 10px 0 var(--or);padding:10px 22px 14px;margin-left:16px" id="stopb">STOP</div></div>`, finw);
  const src8 = H(`<div class="abs mono" style="left:96px;top:398px;font-size:24px;font-weight:400;color:var(--dim);letter-spacing:.1em">SOURCES · NASA JPL · GUINNESS 2026</div>`, finw);
  const lastd = last.querySelector('#lastd'), stopb = last.querySelector('#stopb');
  gsap.set(stopb, { autoAlpha: 0 });
  const t9 = T('end') - .25;
  tl.set([S8.g, S8.w], { autoAlpha: 0 }, t9); tl.set([fin, finw], { autoAlpha: 1 }, t9);
  tl.to([camEl, tcamEl], { filter: 'blur(16px)', duration: .14, ease: 'power2.in' }, t9 - .14); tl.to([camEl, tcamEl], { filter: 'blur(0px)', duration: .26, ease: 'power2.out' }, t9); sfx(t9 - .2, 'whoosh', .8);
  cam(t9, END - t9, { rotationX: 22, scale: .92 }, { rotationX: 0, scale: 1.03 }, 'power2.out', .3, '540px 820px');
  sfx(t9 + .1, 'shimmer', .7, 2.5);
  const sA = wt('end', /stop/) - .1;
  pop(stopb, sA, { scale: 1.8, rotation: 10 }); sfx(sA + .05, 'impact', 1);
  tl.to(src8, { autoAlpha: 1, duration: .5 }, L.end.end);
  hide(src8);
  life.push((t) => { const n = t < t9 ? 0 : Math.min(19, Math.floor(2 + (Math.min(t, sA) - t9) * 6)); lastd.textContent = PI.slice(0, n) + (t < sA ? '_' : '…'); });
  tl.to({}, { duration: Math.max(0, END - tl.duration()) });

  /* ---------- HUD (outside the camera): chapter + progress, captions, grain */
  H('<div class="abs" style="left:0;top:0;width:1080px;height:390px;background:linear-gradient(180deg,rgba(23,32,54,.92) 0%,rgba(23,32,54,.85) 82%,rgba(23,32,54,0) 100%)"></div>', st);
  const chap = H('<div class="abs chap"></div>', st), chapn = H('<div class="abs chapn"></div>', st);
  const CH = [['THE NUMBER', 0, T('what') - .25], ['THE CIRCLE', T('what') - .25, T('inf') - .25], ['FOREVER', T('inf') - .25, T('arch') - .25],
              ['THE CHASE', T('arch') - .25, T('jpl') - .25], ["NASA'S 15", T('jpl') - .25, T('cur') - .25], ['THE POINT', T('cur') - .25, END]];
  const sw = (888 - 5 * 10) / 6, segs = CH.map((c, i) => H(`<div class="seg" style="left:${96 + i * (sw + 10)}px;width:${sw}px"><b></b></div>`, st).firstElementChild);
  const cap = H('<div class="abs" id="cap"><span></span></div>', st), capS = cap.firstElementChild;
  const chunks = SC.lines.flatMap((l) => l.chunks.map((c) => ({ ...c, lid: l.id })));
  const grain = H('<div id="grain"></div>', st); H('<div id="vig"></div>', st);
  const cv = document.createElement('canvas'); cv.width = cv.height = 220; const cx2 = cv.getContext('2d'), im = cx2.createImageData(220, 220);
  for (let k = 0; k < im.data.length; k += 4) { im.data[k] = im.data[k + 1] = im.data[k + 2] = 255; im.data[k + 3] = rnd() * 255 | 0; }
  cx2.putImageData(im, 0, 0); grain.style.backgroundImage = `url(${cv.toDataURL()})`;
  const e3 = gsap.parseEase('power3.out');
  function frame(t) {
    let c = null; for (const ch of chunks) if (t >= ch.s) c = ch;
    const k = e3(clamp(0, 1, (c ? t - c.s : 0) / .2));
    const show = c && t < L.end.end + .3;
    capS.textContent = show ? c.t : ''; capS.style.visibility = show ? 'visible' : 'hidden';
    cap.style.opacity = k; cap.style.transform = `translateY(${(1 - k) * 16}px)`;
    let ci = 0; CH.forEach((cc, i) => { if (t >= cc[1]) ci = i; });
    chap.textContent = 'π — ' + CH[ci][0]; chapn.textContent = `0${ci + 1} / 06`;
    CH.forEach((cc, i) => { segs[i].style.width = (100 * clamp(0, 1, (t - cc[1]) / (cc[2] - cc[1]))) + '%'; });
    life.forEach((f) => f(t));
    const fr = Math.floor(t * 30); grain.style.transform = `translate(${(fr * 37) % 40}px, ${(fr * 53) % 40}px)`;
  }
  window.TL = tl;
  window.seek = (t) => { tl.seek(t, false); frame(t); };
  window.seek(0);
  window.READY = true;
})();
