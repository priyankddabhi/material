<!doctype html>
<html><head><meta charset="utf-8"><title>metaweek demo</title>
<script src="/guides/metaweek/engine/node_modules/gsap/dist/gsap.min.js"></script>
<script src="/guides/metaweek/engine/node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="/guides/metaweek/engine/kit.js"></script>
</head><body>
<script>
// Demo chapter: one scene per line, every kit element once. Copy this file as the starting point for a chapter.
(async () => {
  const k = await KIT({ chapter: { n: 0, total: 9, title: 'THE ENGINE' } });
  const { tl, C, T, wt, L, M, W, H, CX, CY, E, sfx, life } = k;

  /* S1 HOOK — visible on frame 0: ring of "seek(t)" around a giant brace, slab + frame counter cells */
  const S1 = k.scene(true);
  E('circle', { cx: 1240, cy: 560, r: 300, fill: 'rgba(31,54,86,.35)', stroke: C.bp, 'stroke-width': 2, 'stroke-opacity': .45 }, S1.svg);
  const ring = k.ringText(S1.svg, 1240, 560, 340, [['SEEK(T) → FRAME · ', `fill:${C.ink}`], ['PURE FUNCTION OF TIME · ', `fill:${C.or2}`], ['SEEK(T) → FRAME · PURE FUNCTION OF TIME · ', `fill:${C.ink};fill-opacity:.5`]], 26);
  life.push((t) => ring.spin(-t * 8));
  const brace = E('text', { x: 1240, y: 560, 'text-anchor': 'middle', 'dominant-baseline': 'central', style: `font:700 360px "Big Shoulders";fill:${C.ink}` }, S1.svg); brace.textContent = '{ }';
  const s1 = k.slab(S1.w, `<div class="bs" style="font-size:150px">EVERY FRAME</div><div class="sw" style="font-size:96px;margin-top:10px">IS CODE</div>`, { left: M, top: 300, rot: -3 });
  gsap.set(s1, { autoAlpha: 1 });
  const fc = k.cells(S1.w, '00000', { left: M + 40, top: 700, w: 74, h: 112, css: (i) => i === 4 ? `background:${C.or};color:${C.bg};border-color:${C.or}` : '' });
  gsap.set(fc.cells, { autoAlpha: 1 });
  life.push((t) => { const f = String(Math.floor(t * 30)).padStart(5, '0'); fc.cells.forEach((c, i) => (c.textContent = f[i])); });
  k.camSet({ rotationX: 18, scale: 1.06 });
  k.cam(0, T('code') - .3, { rotationX: 18, scale: 1.06 }, { rotationX: 2, scale: 1 }, 'sine.inOut');
  sfx(0.02, 'boom', .8); sfx(wt('hook', /code/), 'impact', .8);
  tl.fromTo(s1, { scale: 1 }, { scale: 1.06, duration: .14, yoyo: true, repeat: 1, immediateRender: false }, wt('hook', /code/));

  /* S2 CODE — panel types itself, one line gets flagged, a stamp lands */
  const S2 = k.scene(); k.cut(T('code') - .25, S1, S2);
  const code = k.codePanel(S2.w, 'render.mjs', [
    '<k>const</k> tl = gsap.<f>timeline</f>({ paused: <k>true</k> });',
    'window.<f>seek</f> = (t) => tl.<f>seek</f>(t, <k>false</k>);',
    '<k>for</k> (<k>let</k> f = 0; f < n; f++) {',
    '  <k>await</k> page.<f>evaluate</f>((t) => <f>seek</f>(t), f / <s>30</s>);',
    '  <k>await</k> page.<f>screenshot</f>({ path: frame(f) });',
    '}  <c>// then ffmpeg → mp4</c>'], { left: M, top: 250, width: 1040 });
  k.typeCode(code, T('code'), .2);
  k.flagLine(code, 2, wt('code', /seek/));
  const st30 = k.stamp(S2.w, 'RENDER', '30 FPS', 'DETERMINISTIC', { left: 1320, top: 300, rot: 6 });
  k.pop(st30, wt('code', /thirty/) - .1, { scale: 1.8, rotation: 20 }); sfx(wt('code', /thirty/), 'impact', .9);
  k.cam(T('code') - .25, .7, { x: 300, rotationY: -22, scale: 1.04 }, { x: 0, rotationY: 0, scale: 1 }, 'power3.out');

  /* S3 CHAIN — iso package chain; one block goes bad, warning icon, camera cranes in */
  const S3 = k.scene(); k.cut(T('chain') - .25, S2, S3);
  const O = [760, 560];
  k.isoFloor(S3.svg, O, -80, 700, -80, 260);
  const names = ['app', 'http', 'zlib', 'utils', 'llm'], blocks = names.map((n, i) => k.isoPackage(S3.svg, [O[0] + .866 * (i * 140), O[1] + .5 * (i * 140)], n, k.TONE.cof, 96));
  const bad = k.isoPackage(S3.svg, [O[0] + .866 * 560, O[1] + .5 * 560], 'llm', k.TONE.mar, 96); k.hide(bad);
  blocks.forEach((b, i) => { k.slide(b, T('chain') + i * .12, 0, -60, .4); sfx(T('chain') + i * .12, 'tick', .6); });
  tl.set(bad, { autoAlpha: 1 }, wt('chain', /bad/)); tl.set(blocks[4], { autoAlpha: 0 }, wt('chain', /bad/));
  const warn = await k.icon(S3.svg, 'alert-triangle', { x: O[0] + .866 * 560 - 70, y: O[1] + .5 * 560 - 290, size: 140, color: C.red, stroke: 2 }); k.hide(warn);
  k.pop(warn, wt('chain', /bad/), { scale: 2 }); sfx(wt('chain', /bad/), 'impact', 1);
  tl.to(blocks.slice(0, 4).reverse(), { opacity: .35, duration: .2, stagger: .15 }, wt('chain', /poison/));
  const s3 = k.slab(S3.w, `<div class="mono" style="font-size:26px;color:${C.ink}">SUPPLY CHAIN</div><div class="bs" style="font-size:120px;margin-top:6px">1 BAD BLOCK</div>`, { left: M, top: 760, bg: C.mar, color: C.ink, shadow: C.or, rot: -2 });
  k.pop(s3, wt('chain', /poison/) - .1, { scale: 1.6, rotation: -12 });
  k.cam(T('chain') - .25, L.chain.end - T('chain') + .3, { rotationX: 30, y: -100, scale: 1.12 }, { rotationX: 6, y: 0, scale: 1 }, 'power2.out', .3);

  /* S4 END — two slabs, ring keeps turning */
  const S4 = k.scene(); k.cut(T('end') - .25, S3, S4);
  const r4 = k.ringText(S4.svg, CX, CY - 20, 300, [['SAME STYLE ● ANY TOPIC ● ', `fill:${C.ink}`], ['SAME STYLE ● ANY TOPIC ● ', `fill:${C.or2}`]], 34);
  life.push((t) => r4.spin(t * 10));
  const a = k.slab(S4.w, '<div class="bs" style="font-size:130px">SAME STYLE</div>', { left: CX - 330, top: 380, rot: -3 });
  const b = k.slab(S4.w, '<div class="bs" style="font-size:130px">ANY TOPIC</div>', { left: CX - 230, top: 560, bg: C.blu, color: C.ink, border: C.ink, shadow: C.or, rot: 2 });
  k.pop(a, wt('end', /Same/), { scale: 1.6, rotation: -10 }); sfx(wt('end', /Same/), 'impact', .8);
  k.pop(b, wt('end', /Any/), { scale: 1.6, rotation: 12 }); sfx(wt('end', /Any/), 'impact', .9);
  k.cam(T('end') - .25, k.END - T('end') + .25, { rotationX: 20, scale: .94 }, { rotationX: 0, scale: 1.03 }, 'power2.out');
  sfx(T('end'), 'shimmer', .6, 2.5);

  k.finish();
})();
</script>
</body></html>
